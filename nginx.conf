server {
    listen 80;
    server_name localhost;

    # Web assets
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API - CRITICAL: Must forward Range header for video
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        
        # Forward ALL headers including Range
        proxy_pass_request_headers on;
        proxy_set_header Range $http_range;
        proxy_set_header Accept-Ranges $http_accept_ranges;
        
        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for streaming video
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Support for 206 Partial Content
        proxy_set_header If-Range $http_if_range;
    }

    # Health check
    location /health {
        proxy_pass http://api:3001/health;
    }
}
