services:
  # API Service (Hono)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dracin-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-file:/data/dracin.sqlite}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-secret-key-here-min-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@dracin.mukhsin.web.id}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PRIMARY_API_URL: ${PRIMARY_API_URL:-http://api:3001}
      API_PROXY_URL: ${API_PROXY_URL:-http://api-proxy:3002}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET}
    volumes:
      - sqlite_data:/data
    networks:
      - dracin-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dracin-api.rule=Host(`dracin.mukhsin.web.id`) && PathPrefix(`/api`)"
      - "traefik.http.services.dracin-api.loadbalancer.server.port=3001"
      - "traefik.http.routers.dracin-api.entrypoints=web"
      - "traefik.http.routers.dracin-api.tls=false"
      # Note: Traefik passes all headers by default, including Range
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Web Service (TanStack Start)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: dracin-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    networks:
      - dracin-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dracin-web.rule=Host(`dracin.mukhsin.web.id`)"
      - "traefik.http.services.dracin-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.dracin-web.entrypoints=web"
      - "traefik.http.routers.dracin-web.tls=false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.125"
          memory: 128M

  # API-Proxy Service
  api-proxy:
    build:
      context: .
      dockerfile: apps/api-proxy/Dockerfile
    container_name: dracin-api-proxy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      SECRET_KEY: ${SECRET_KEY:-/app/secrets/private-key.pem}
    volumes:
      - /root/apps/dracin/secrets/private-key.pem:/app/secrets/private-key.pem:ro
    networks:
      - dracin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.125"
          memory: 128M

  # Drizzle Gateway Service
  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    restart: unless-stopped
    ports:
      - "4983:4983"
    environment:
      PORT: "4983"
      MASTERPASS: "${MASTERPASS}"
    volumes:
      - sqlite_data:/data
    networks:
      - dracin-network
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.dracin-drizzle.rule=Host(`dracin.mukhsin.web.id`) && PathPrefix(`/db`)"
    #   - "traefik.http.routers.dracin-drizzle.middlewares=strip-db-prefix"
    #   - "traefik.http.middlewares.strip-db-prefix.stripprefix.prefixes=/db"
    #   - "traefik.http.services.dracin-drizzle.loadbalancer.server.port=4983"
    #   - "traefik.docker.network=dokploy-network"

volumes:
  sqlite_data:
    driver: local

networks:
  dracin-network:
    external: true
    name: dokploy-network
